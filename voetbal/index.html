<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gouden Elf">
  <meta name="description" content="Gouden Elf: snel voetbal voor je smartphone en tablet. Verzamel sterren uit een eigen voetbalwereld, open pakketten en bouw je droomelftal.">
  <title>Gouden Elf – voetbal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bc-800i-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bc-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="is-menu">
    <canvas id="pitch" aria-hidden="true"></canvas>
    <div id="menu-bg" aria-hidden="true"></div>

    <!-- In-match HUD -->
    <div id="hud" hidden>
      <div class="scorebug" id="scorebug">
        <div class="sb-team sb-home"><span class="sb-flag" id="sb-flag0"></span><span class="sb-name" id="sb-name0">THU</span></div>
        <div class="sb-score"><span id="sb-s0">0</span><i>–</i><span id="sb-s1">0</span></div>
        <div class="sb-team sb-away"><span class="sb-name" id="sb-name1">UIT</span><span class="sb-flag" id="sb-flag1"></span></div>
        <div class="sb-clock" id="sb-clock">00:00</div>
      </div>
      <button class="hud-btn" id="btn-pause" aria-label="Pauze">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <canvas id="radar" aria-hidden="true"></canvas>
      <div id="banner" aria-live="polite"></div>
      <div id="hint"></div>
      <div id="goal-flash" aria-live="assertive">
        <div class="gf-word">DOELPUNT!</div>
        <div class="gf-scorer" id="gf-scorer"></div>
      </div>
      <div id="replay-tag"><span class="dot"></span>HERHALING<small>tik om over te slaan</small></div>
      <div id="attack-panel"></div>
    </div>

    <!-- Touch controls -->
    <div id="controls" hidden>
      <div class="joy" id="joy"><div class="joy-ring"></div><div class="joy-knob" id="joy-knob"></div></div>
      <div class="cbtn cbtn-shoot" id="b-shoot" data-btn="shoot">
        <svg class="power" viewBox="0 0 100 100" aria-hidden="true"><circle class="power-bg" cx="50" cy="50" r="46"/><circle class="power-fg" id="power-fg" cx="50" cy="50" r="46"/></svg>
        <span class="cbtn-label" id="l-shoot">SCHIET</span>
      </div>
      <div class="cbtn cbtn-pass" id="b-pass" data-btn="pass"><span class="cbtn-label" id="l-pass">PASS</span></div>
      <div class="cbtn cbtn-through" id="b-through" data-btn="through"><span class="cbtn-label" id="l-through">DOOR</span></div>
      <div class="cbtn cbtn-sprint" id="b-sprint" data-btn="sprint"><span class="cbtn-label" id="l-sprint">SPRINT</span></div>
    </div>

    <!-- Menu screens -->
    <main id="screens">
      <section class="screen" id="s-title">
        <div class="title-wrap">
          <div class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 120 120"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a1"/><stop offset=".55" stop-color="#f5c542"/><stop offset="1" stop-color="#b8871b"/></linearGradient></defs><path d="M60 6l14 29 32 5-23 22 5 32-28-15-28 15 5-32L14 40l32-5z" fill="url(#lg)"/><circle cx="60" cy="58" r="17" fill="#0b1b33"/><path d="M60 47l7 5-3 8h-8l-3-8zM49 54l4 1 2 7-3 4-4-3zM71 54l-4 1-2 7 3 4 4-3z" fill="#f5c542"/></svg>
          </div>
          <h1 class="logo-text">GOUDEN <span>ELF</span></h1>
          <p class="tagline">Speel met de sterren. Bouw je droomelftal.</p>
          <button class="btn btn-primary btn-xl pulse" id="btn-start"><span>Tik om te spelen</span></button>
          <a class="back-home" href="../">← Onder Constructie</a>
        </div>
      </section>

      <section class="screen" id="s-home" hidden>
        <header class="topbar">
          <div class="tb-logo">GOUDEN <span>ELF</span></div>
          <div class="tb-right">
            <div class="coins" id="coins-home"><i class="coin"></i><b>0</b></div>
            <button class="icon-btn" id="btn-fullscreen" aria-label="Volledig scherm"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button class="icon-btn" data-go="s-settings" aria-label="Instellingen"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-.1-3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.5-1.5L15 2h-4l-.4 2.5A8 8 0 0 0 8 6l-2.4-1-2 3.4 2 1.6a8 8 0 0 0 0 3l-2 1.6 2 3.4L8 18a8 8 0 0 0 2.6 1.5L11 22h4l.4-2.5A8 8 0 0 0 18 18l2.4.9 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
          </div>
        </header>
        <div class="home-grid">
          <button class="tile tile-play" data-mode="match">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 14l8 6-3 10H19l-3-10z" fill="currentColor"/></svg></span>
            <span class="tile-title">Snelle wedstrijd</span>
            <span class="tile-sub">11 tegen 11 · volledige match</span>
            <span class="tile-cta">Speel nu</span>
          </button>
          <button class="tile tile-attack" data-mode="attack">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><path d="M27 4L10 27h12l-3 17 19-25H26z" fill="currentColor"/></svg></span>
            <span class="tile-title">Aanvalsduel</span>
            <span class="tile-sub">Alleen aanvallen · snel</span>
          </button>
          <button class="tile tile-cup" data-mode="cup">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><path d="M14 6h20v8a10 10 0 0 1-20 0zM14 9H7a7 7 0 0 0 7 9M34 9h7a7 7 0 0 1-7 9M24 24v8M16 42h16l-2-10H18z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></span>
            <span class="tile-title">Gouden Beker</span>
            <span class="tile-sub">Toernooi · 8 teams</span>
          </button>
          <button class="tile tile-pens" data-mode="penalties">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><path d="M5 12h38v26" fill="none" stroke="currentColor" stroke-width="3"/><path d="M5 12v26" stroke="currentColor" stroke-width="3"/><circle cx="30" cy="25" r="5" fill="currentColor"/></svg></span>
            <span class="tile-title">Strafschoppen</span>
            <span class="tile-sub">Nerven van staal</span>
          </button>
          <button class="tile tile-squad" data-go="s-squad">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><path d="M16 6l-10 6 4 9 5-2v23h18V19l5 2 4-9-10-6a8 8 0 0 1-16 0z" fill="currentColor"/></svg></span>
            <span class="tile-title">Mijn Elf</span>
            <span class="tile-sub" id="home-ovr">Team OVR –</span>
          </button>
          <button class="tile tile-help" data-go="s-help">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18.5 19a5.5 5.5 0 1 1 8 4.9c-1.6.8-2.5 2-2.5 3.6V29" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="35" r="2.2" fill="currentColor"/></svg></span>
            <span class="tile-title">Uitleg</span>
            <span class="tile-sub">Besturing &amp; tips</span>
          </button>
          <button class="tile tile-packs" data-go="s-packs">
            <span class="tile-icon"><svg viewBox="0 0 48 48"><rect x="9" y="6" width="24" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="3"/><rect x="15" y="10" width="24" height="34" rx="3" fill="currentColor"/></svg></span>
            <span class="tile-title">Pakketten</span>
            <span class="tile-sub">Nieuwe sterren</span>
            <span class="badge" id="packs-badge" hidden>!</span>
          </button>
        </div>
        <footer class="home-foot">
          <a class="link-btn" href="../">← Onder Constructie</a>
        </footer>
      </section>

      <section class="screen" id="s-setup" hidden>
        <header class="topbar">
          <button class="icon-btn back" data-back aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h2 class="screen-title" id="setup-title">Snelle wedstrijd</h2>
          <div class="tb-right"></div>
        </header>
        <div class="setup">
          <div class="matchup">
            <div class="team-pick" id="pick0"></div>
            <div class="vs">VS</div>
            <div class="team-pick" id="pick1"></div>
          </div>
          <div class="setup-opts">
            <div class="opt-row"><span class="opt-label">Niveau</span><div class="seg" id="seg-diff"></div></div>
            <div class="opt-row" id="row-dur"><span class="opt-label" id="dur-label">Duur</span><div class="seg" id="seg-dur"></div></div>
          </div>
          <button class="btn btn-primary btn-xl" id="btn-kickoff"><span>Aftrap!</span></button>
        </div>
      </section>

      <section class="screen" id="s-squad" hidden></section>
      <section class="screen" id="s-packs" hidden></section>
      <section class="screen" id="s-cup" hidden></section>
      <section class="screen" id="s-settings" hidden></section>
      <section class="screen" id="s-help" hidden></section>
    </main>

    <!-- Overlays -->
    <div id="overlays"></div>
    <div id="rotate">
      <div class="rot-phone" aria-hidden="true"></div>
      <p>Draai je toestel voor de beste ervaring</p>
      <button class="btn btn-ghost" id="rot-quit"><span>Terug naar menu</span></button>
    </div>
    <div id="toast" role="status"></div>
  </div>
  <noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Gouden Elf heeft JavaScript nodig.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
