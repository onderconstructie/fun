<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manillen">
  <meta name="description" content="Manillen: het Vlaamse kaartspel waarin de 10 de hoogste kaart is. Speel met vier (met een partner) of met twee, tegen de computer. Met heldere spelregels en varianten.">
  <title>Manillen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bc-800i-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bc-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="s-h" viewBox="0 0 100 100"><path d="M50 90C22 68 5 51 5 31 5 16 16 7 29 7c10 0 17 6 21 15 4-9 11-15 21-15 13 0 24 9 24 24 0 20-17 37-45 59Z"/></symbol>
      <symbol id="s-r" viewBox="0 0 100 100"><path d="M50 4Q67 30 88 50 67 70 50 96 33 70 12 50 33 30 50 4Z"/></symbol>
      <symbol id="s-s" viewBox="0 0 100 100"><path d="M50 5C78 30 95 44 95 61c0 14-10 22-21 22-9 0-16-5-19-12 1 10 4 18 12 24H33c8-6 11-14 12-24-3 7-10 12-19 12C15 83 5 75 5 61 5 44 22 30 50 5Z"/></symbol>
      <symbol id="s-k" viewBox="0 0 100 100"><circle cx="50" cy="28" r="20"/><circle cx="27" cy="59" r="20"/><circle cx="73" cy="59" r="20"/><path d="M43 40h14v18H43z"/><path d="M46 60c0 15-4 26-13 35h34c-9-9-13-20-13-35Z"/></symbol>
    </defs>
  </svg>

  <div id="app" class="is-menu">
    <!-- ======== speeltafel ======== -->
    <section id="table" hidden aria-label="Speeltafel">
      <header id="hud">
        <button class="icon-btn" id="btn-menu" aria-label="Pauze">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button class="hud-mid" id="h-mid" aria-describedby="h-round">
          <span class="trump-chip" id="h-trump">Troef?</span>
          <small id="h-round">Ronde 1</small>
        </button>
        <div class="hud-score" id="h-score"></div>
        <div id="roundbar"></div>
      </header>

      <div id="felt">
        <div class="seat" id="pos-top"></div>
        <div class="seat" id="pos-left"></div>
        <div class="seat" id="pos-right"></div>
        <div class="stacks" id="stacks-opp" role="group" aria-label="Open kaarten van de tegenspeler"></div>
        <div id="trick" role="group" aria-label="Kaarten op tafel"></div>
        <div class="stacks" id="stacks-me" role="group" aria-label="Jouw open kaarten op tafel"></div>
        <div class="seat seat-me" id="pos-me"></div>
        <div id="decide" hidden></div>
      </div>

      <div id="status-row">
        <p id="status">&nbsp;</p>
        <button class="chip-btn" id="btn-tip" hidden aria-keyshortcuts="T"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Tip</button>
        <button class="chip-btn" id="btn-last" hidden aria-label="Vorige slag bekijken"></button>
      </div>
      <div id="hand" role="group" aria-label="Jouw kaarten"></div>
      <aside id="side" aria-label="Verloop van de ronde"></aside>
      <div id="toast" role="status" hidden></div>
    </section>

    <!-- ======== schermen ======== -->
    <main id="screens">
      <section class="screen" id="s-home">
        <div class="home-top"><button class="icon-btn" data-go="s-settings" aria-label="Instellingen"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 4.6-1.9-.3a6.8 6.8 0 0 1-.6 1.5l1.1 1.6-1.6 1.6-1.6-1.1c-.5.3-1 .5-1.5.6l-.3 1.9h-2.3l-.3-1.9a6.8 6.8 0 0 1-1.5-.6l-1.6 1.1-1.6-1.6 1.1-1.6c-.3-.5-.5-1-.6-1.5l-1.9-.3v-2.3l1.9-.3c.1-.5.3-1 .6-1.5L4.5 7.4 6.1 5.8l1.6 1.1c.5-.3 1-.5 1.5-.6l.3-1.9h2.3l.3 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.6 1.6-1.1 1.6c.3.5.5 1 .6 1.5l1.9.3Z" fill="currentColor"/></svg></button></div>
        <div class="logo" aria-hidden="true" id="logo"></div>
        <h1 class="title">Manil<span>len</span></h1>
        <p class="tag">De 10 is de baas.</p>
        <div class="tiles">
          <button class="tile tile-main" id="btn-resume" hidden>
            <span class="tile-title">Verder spelen</span>
            <span class="tile-sub" id="resume-sub"></span>
          </button>
          <button class="tile" id="btn-four">
            <span class="tile-ico" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="tile-title">Met vier</span>
            <span class="tile-sub">Jij en je partner tegen twee</span>
          </button>
          <button class="tile" id="btn-two">
            <span class="tile-ico two" aria-hidden="true"><i></i><i></i></span>
            <span class="tile-title">Met twee</span>
            <span class="tile-sub">Jij tegen één, met kaarten op tafel</span>
          </button>
          <button class="tile" data-go="s-rules">
            <span class="tile-title">Spelregels</span>
            <span class="tile-sub">Uitleg en varianten</span>
          </button>
        </div>
        <footer class="home-foot"><a class="link-btn" href="../">← Onder Constructie</a></footer>
      </section>

      <section class="screen" id="s-rules" hidden>
        <header class="bar"><button class="icon-btn" id="rules-back" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Spelregels</h2><span class="bar-right"></span></header>
        <nav class="rules-nav" aria-label="Onderdelen">
          <a href="#r-doel">Doel</a><a href="#r-kaarten">Kaarten</a><a href="#r-troef">Troef</a><a href="#r-mee">Meegaan</a><a href="#r-spelen">Spelen</a><a href="#r-tellen">Tellen</a><a href="#r-twee">Met twee</a><a href="#r-var" class="hot">Varianten</a>
        </nav>
        <div class="help" id="rules-body"></div>
      </section>

      <section class="screen" id="s-settings" hidden>
        <header class="bar"><button class="icon-btn" id="settings-back" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Instellingen</h2><span class="bar-right"></span></header>
        <div class="settings" id="settings-body"></div>
      </section>
    </main>

    <div id="overlays"></div>
  </div>
  <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Manillen heeft JavaScript nodig.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
